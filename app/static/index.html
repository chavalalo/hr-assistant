<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HR Assistant</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0 auto;
      max-width: 720px;
      padding: 1rem;
      color: #222;
    }
    h1 { font-size: 1.4rem; }
    #conversation {
      border: 1px solid #ccc;
      border-radius: 6px;
      min-height: 200px;
      padding: 0.5rem;
      margin-bottom: 1rem;
    }
    .turn { margin: 0.5rem 0; padding: 0.5rem; border-radius: 4px; }
    .user { background: #eef3fb; }
    .assistant { background: #f4f4f4; }
    .error { background: #fdecea; color: #8a1c1c; }
    .tools { font-size: 0.85rem; color: #555; margin-top: 0.25rem; }
    form { display: flex; gap: 0.5rem; }
    input { flex: 1; padding: 0.5rem; }
    button { padding: 0.5rem 1rem; }
    .key-row { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <h1>HR Assistant</h1>
  <div class="key-row">
    <label for="api-key">Clave de acceso</label>
    <input id="api-key" data-testid="api-key" type="password"
           placeholder="Escribe tu clave" autocomplete="off">
  </div>
  <p class="help" data-testid="help">
    Pregunta por un empleado (EMP-0001), un departamento o una de las políticas de
    RH (vacaciones, home office...). No escribas datos personales: se ocultan antes
    de llegar al modelo.
  </p>
  <div id="conversation" data-testid="answer" aria-live="polite"></div>
  <form id="ask-form">
    <input id="question" data-testid="question" type="text"
           placeholder="Pregunta por un empleado, un departamento o una política"
           autocomplete="off">
    <button id="send" data-testid="send" type="submit">Enviar</button>
  </form>
  <script>
    // El historial vive solo en el navegador; el servidor no guarda nada.
    const history = [];
    const conversation = document.getElementById("conversation");
    const form = document.getElementById("ask-form");
    const questionInput = document.getElementById("question");
    const sendButton = document.getElementById("send");
    const keyInput = document.getElementById("api-key");
    // La clave vive solo en sessionStorage: se borra al cerrar la pestaña.
    const KEY_STORAGE_NAME = "hr-assistant-api-key";

    keyInput.value = sessionStorage.getItem(KEY_STORAGE_NAME) || "";
    keyInput.addEventListener("change", function () {
      sessionStorage.setItem(KEY_STORAGE_NAME, keyInput.value.trim());
    });

    // Agrega una vuelta a la conversación usando solo textContent.
    // requestId es el id de la petición que la persona puede pasar a soporte.
    function addTurn(kind, text, tools, requestId) {
      const turn = document.createElement("div");
      turn.className = "turn " + kind;
      const body = document.createElement("div");
      if (kind === "assistant") {
        // Cada vuelta del asistente se ubica por este data-testid.
        body.setAttribute("data-testid", "assistant-answer");
      }
      body.textContent = text;
      turn.appendChild(body);
      if (tools !== undefined) {
        const toolsLine = document.createElement("div");
        toolsLine.className = "tools";
        toolsLine.textContent = tools.length
          ? "Herramientas usadas: " + tools.join(", ")
          : "Herramientas usadas: ninguna";
        turn.appendChild(toolsLine);
      }
      if (requestId) {
        const idLine = document.createElement("div");
        idLine.className = "tools";
        idLine.setAttribute("data-testid", "request-id");
        idLine.textContent = "Id de la petición: " + requestId;
        turn.appendChild(idLine);
      }
      conversation.appendChild(turn);
    }

    async function ask(question, apiKey) {
      const response = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-API-Key": apiKey },
        body: JSON.stringify({ question: question, history: history })
      });
      if (!response.ok) {
        const error = new Error("status " + response.status);
        error.status = response.status;
        error.requestId = response.headers.get("X-Request-ID");
        error.retryAfter = response.headers.get("Retry-After");
        throw error;
      }
      return response.json();
    }

    // Traduce un error de la API al mensaje que ve la persona.
    function errorMessage(error) {
      if (error.status === 401) {
        return "Clave inválida";
      }
      if (error.status === 400) {
        return "La pregunta fue bloqueada por la política de entrada. " +
          "Pregunta por un empleado, un departamento o una política.";
      }
      if (error.status === 429) {
        const seconds = parseInt(error.retryAfter, 10);
        const wait = Number.isFinite(seconds) && seconds > 0 ? seconds : 60;
        return "Demasiadas preguntas; espera " + wait + " segundos";
      }
      return "No se pudo obtener una respuesta. Intenta de nuevo en un momento.";
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      const question = questionInput.value.trim();
      if (!question) {
        addTurn("error", "Escribe una pregunta antes de enviar.");
        return;
      }
      const apiKey = keyInput.value.trim();
      sessionStorage.setItem(KEY_STORAGE_NAME, apiKey);
      addTurn("user", question);
      questionInput.value = "";
      sendButton.disabled = true;
      try {
        const body = await ask(question, apiKey);
        addTurn("assistant", body.answer, body.tools_used || [], body.request_id);
        history.push({ role: "user", content: question });
        history.push({ role: "assistant", content: body.answer });
      } catch (error) {
        addTurn("error", errorMessage(error), undefined, error.requestId);
      } finally {
        sendButton.disabled = false;
        questionInput.focus();
      }
    });
  </script>
</body>
</html>
