# Blueprint de Render para el HR Assistant (spec/04-production.md, punto 7).
# El servicio se llama igual que el repositorio para no actualizar por error otro
# servicio que ya exista en la cuenta.
services:
  - type: web
    name: hr-assistant
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Solo publica cuando el pipeline de CI pasa en el commit
    autoDeployTrigger: checksPass
    envVars:
      # Con production el producto aplica las reglas de compliance al arrancar
      - key: ENVIRONMENT
        value: production
      - key: MODEL_PROVIDER
        value: gateway
      - key: HIDE_INPUTS
        value: "true"
      - key: HIDE_OUTPUTS
        value: "true"
      # Secretos: Render pide su valor al crear el Blueprint; nunca van aquí.
      # LANGSMITH_API_KEY es opcional y se agrega en Render > Environment.
      - key: API_KEYS
        sync: false
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_API_TOKEN
        sync: false
