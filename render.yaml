# Blueprint de Render para el HR Assistant (spec/04-production.md, punto 7, y
# spec/05-reto.md, punto 9).
# El servicio se llama igual que el repositorio para no actualizar por error otro
# servicio que ya exista en la cuenta.
services:
  - type: web
    name: hr-assistant
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    # /ready revisa directorio, políticas y precios: Render no manda tráfico a una
    # instancia a la que le falte alguno. /health sigue disponible para la prueba
    # de humo.
    healthCheckPath: /ready
    # Solo publica cuando el pipeline de CI pasa en el commit
    autoDeployTrigger: checksPass
    envVars:
      # Con production el producto aplica las reglas de compliance al arrancar
      - key: ENVIRONMENT
        value: production
      - key: MODEL_PROVIDER
        value: gateway
      - key: HIDE_INPUTS
        value: "true"
      - key: HIDE_OUTPUTS
        value: "true"
      # Caché de respuestas: 5 minutos (spec/05-reto.md, punto 7)
      - key: ANSWER_CACHE_TTL_SECONDS
        value: "300"
      # Secretos y datos de la cuenta: Render pide su valor al crear el Blueprint;
      # nunca van aquí.
      - key: API_KEYS
        sync: false
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_API_TOKEN
        sync: false
      # Clientes de API_KEYS que pueden leer /metrics; en producción no puede
      # quedar vacía o el producto no arranca (compliance).
      - key: METRICS_CLIENTS
        sync: false
      # CF_AIG_TOKEN y LANGSMITH_API_KEY son opcionales y no van en el Blueprint:
      # si se usan, se agregan a mano en Render > Environment.
